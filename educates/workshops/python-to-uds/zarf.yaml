# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
---
apiVersion: zarf.dev/v1beta1
kind: ZarfPackageConfig
metadata:
  name: educates-python-to-uds
  description: ARM64 Educates workshop for packaging a stateless application for UDS
  version: 0.2.0-uds.2

values:
  files:
    - zarf-values.yaml
  schema: zarf-values.schema.json

components:
  - name: workshop
    description: Python-to-UDS workshop image, definition, and training portal
    charts:
      - name: educates-python-to-uds
        local:
          path: chart
        namespace: educates
        values:
          - sourcePath: .portal.sessionsMaximum
            targetPath: .portal.sessionsMaximum
          - sourcePath: .portal.anonymousMaximum
            targetPath: .portal.anonymousMaximum
    images:
      - name: ghcr.io/defenseunicorns-labs/educates-python-to-uds-image:0.1.0
        source: daemon

  # Educates creates and owns the portal namespace before this chart installs
  # its UDS Package. Do not pre-create the namespace in the workshop chart.
  - name: workshop-routing
    description: UDS portal exposure and cross-namespace session traffic policy
    actions:
      onDeploy:
        before:
          - cmd: ./zarf tools kubectl wait --for=create namespace/uds-labs-ui --timeout=300s
        onSuccess:
          # Kopf does not rebuild its discovery watch after RBAC changes. Restart
          # the portal after the read-only CRD binding is installed.
          - cmd: ./zarf tools kubectl wait --for=create deployment/training-portal -n uds-labs-ui --timeout=300s
          - cmd: ./zarf tools kubectl rollout restart deployment/training-portal -n uds-labs-ui
          - cmd: ./zarf tools kubectl rollout status deployment/training-portal -n uds-labs-ui --timeout=300s
    charts:
      - name: uds-python-to-uds-portal-config
        local:
          path: portal-chart
        namespace: uds-labs-ui
