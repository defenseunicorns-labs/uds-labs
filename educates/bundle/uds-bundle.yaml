---
kind: UDSBundle
metadata:
  name: educates-uds-labs-spike
  description: Educates platform and Python-to-UDS workshop
  version: 0.2.0

packages:
  - name: educates
    path: ../packages/platform
    ref: 4.0.0-alpha.10-uds.0
    overrides:
      platform:
        educates-training-platform:
          variables:
            - path: global.clusterIngress.domain
              name: DOMAIN
              description: Domain shared by Educates URLs and the UDS tenant gateway
              default: uds.dev
  - name: educates-python-to-uds
    path: ../workshops/python-to-uds
    ref: 0.1.0
