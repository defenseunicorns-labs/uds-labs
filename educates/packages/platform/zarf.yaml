# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
---
apiVersion: zarf.dev/v1beta1
kind: ZarfPackageConfig
metadata:
  name: educates
  description: Upstream Educates Helm runtime integrated with UDS Core
  version: 4.0.0-alpha.10-uds.0

values:
  files:
    - zarf-values.yaml
  schema: zarf-values.schema.json

components:
  - name: platform
    description: Educates controllers and declarative UDS Core integration
    charts:
      - name: uds-educates-platform-config
        local:
          path: chart
        namespace: educates-platform
      - name: educates-training-platform
        releaseName: educates-platform
        oci:
          url: oci://ghcr.io/educates/charts/educates-training-platform
          ref:
            digest: sha256:4db518658f044fea7aa5a968df6c2caadee94ec202819f1d092e57fe06c56757
        namespace: educates-platform
        skipWait: true
        valuesFiles:
          - path: values/common-values.yaml
          - path: values/upstream-values.yaml
        values:
          - sourcePath: .domain
            targetPath: .global.clusterIngress.domain
    actions:
      onDeploy:
        onSuccess:
          - wait:
              cluster:
                kind: Deployment
                name: session-manager
                namespace: educates-platform
            maxTotalSeconds: 300
          - wait:
              cluster:
                kind: Deployment
                name: secrets-manager
                namespace: educates-platform
            maxTotalSeconds: 300
    images:
      - name: ghcr.io/educates/educates-session-manager:4.0.0-alpha.10
      - name: ghcr.io/educates/educates-secrets-manager:4.0.0-alpha.10
      # Runtime-spawned workloads are absent from Helm image discovery.
      - name: ghcr.io/educates/educates-training-portal:4.0.0-alpha.10
      - name: ghcr.io/educates/educates-base-environment:4.0.0-alpha.10
      - name: docker.io/library/docker:27.5.1-dind
