# Copy this file to bundle/uds-config.yaml and customize it for the target
# cluster. The destination is intentionally ignored by Git.
shared:
  domain: uds.dev

variables:
  kubevirt:
    VM_NAMESPACES:
      - uds-labs-vms
    KUBEVIRT_OPERATOR_NODE_PLACEMENT: &defaultPlacement
      nodeSelector: {}
      affinity: {}
      tolerations: []
    KUBEVIRT_INFRA_NODE_PLACEMENT: *defaultPlacement
    KUBEVIRT_WORKLOAD_NODE_PLACEMENT: *defaultPlacement

  cdi:
    OPERATOR_NODE_PLACEMENT: *defaultPlacement
    INFRA_NODE_PLACEMENT: *defaultPlacement
    WORKLOAD_NODE_PLACEMENT: *defaultPlacement
    WORKLOAD_NAMESPACES:
      - uds-labs-vms

  uds-labs:
    LAB_SERVER_NODE_PLACEMENT: *defaultPlacement
    LAB_OPERATOR_NODE_PLACEMENT: *defaultPlacement
    # This controls both the VMI and its capacity-bootstrap Pod. Set a
    # KubeVirt-capable pool selector and any required tolerations here.
    LAB_VMI_NODE_PLACEMENT: *defaultPlacement
