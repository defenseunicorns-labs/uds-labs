kind: UDSBundle
metadata:
  name: uds-labs
  description: UDS Labs KubeVirt bundle
  version: v0.6.0-uds.2
packages:
  - name: kubevirt
    repository: ghcr.io/uds-packages/kubevirt
    ref: v1.9.0-uds.0-upstream
    overrides:
      kubevirt:
        uds-kubevirt-config:
          variables:
            - path: vmNamespaces
              name: VM_NAMESPACES
              default:
                - uds-labs-vms
            - path: operator.nodePlacement
              name: KUBEVIRT_OPERATOR_NODE_PLACEMENT
              default:
                affinity: {}
                nodeSelector: {}
                tolerations: []
            - path: kubevirt.infra.nodePlacement
              name: KUBEVIRT_INFRA_NODE_PLACEMENT
              default:
                affinity: {}
                nodeSelector: {}
                tolerations: []
            - path: kubevirt.workloads.nodePlacement
              name: KUBEVIRT_WORKLOAD_NODE_PLACEMENT
              default:
                affinity: {}
                nodeSelector: {}
                tolerations: []
  - name: cdi
    repository: ghcr.io/uds-packages/cdi
    ref: 1.65.0-uds.5-upstream
    overrides:
      cdi:
        uds-cdi-config:
          variables:
            - path: operator.nodePlacement
              name: OPERATOR_NODE_PLACEMENT
              default:
                affinity: {}
                nodeSelector: {}
                tolerations: []
            - path: cdi.infra
              name: INFRA_NODE_PLACEMENT
              default:
                affinity: {}
                nodeSelector: {}
                tolerations: []
            - path: cdi.workloads
              name: WORKLOAD_NODE_PLACEMENT
              default:
                affinity: {}
                nodeSelector: {}
                tolerations: []
            - path: workloadNamespaces
              name: WORKLOAD_NAMESPACES
              default:
                - uds-labs-vms
  - name: uds-labs-vm-images
    path: ../packages/vm-images
    ref: 0.4.3
    overrides:
      golden-pvcs:
        golden-pvcs:
          values:
            - path: goldenPVCs.storageClass
              value: ""
      vm-image-server:
        vm-image-server:
          values:
            - path: imageServers.placement
              value:
                affinity: {}
                nodeSelector: {}
                tolerations: []
  - name: uds-labs
    path: ../
    ref: v0.6.0-uds.2-upstream
    overrides:
      uds-labs:
        uds-labs:
          values:
            - path: serverPlacement
              value:
                affinity: {}
                nodeSelector: {}
                tolerations: []
            - path: operatorPlacement
              value:
                affinity: {}
                nodeSelector: {}
                tolerations: []
            - path: vmiPlacement
              value:
                affinity: {}
                nodeSelector: {}
                tolerations: []
            - path: storageClass
              value: ""
            - path: maxActiveSessions
              value: 4
            - path: auth.allowedGroups
              value: []
          variables:
            - path: serverPlacement
              name: LAB_SERVER_NODE_PLACEMENT
              default:
                affinity: {}
                nodeSelector: {}
                tolerations: []
            - path: operatorPlacement
              name: LAB_OPERATOR_NODE_PLACEMENT
              default:
                affinity: {}
                nodeSelector: {}
                tolerations: []
            - path: vmiPlacement
              name: LAB_VMI_NODE_PLACEMENT
              default:
                affinity: {}
                nodeSelector: {}
                tolerations: []
