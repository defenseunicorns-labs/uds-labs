# Canonical UDS Labs bundle. KubeVirt and CDI are consumed as published OCI
# packages; repository-owned packages are assembled from local paths.
kind: UDSBundle
metadata:
  name: uds-labs
  description: UDS Labs KubeVirt bundle
  version: dev

packages:
  - name: kubevirt
    repository: ghcr.io/uds-packages/kubevirt
    ref: v1.9.0-uds.0-upstream
    overrides:
      kubevirt:
        uds-kubevirt-config:
          variables:
            - name: VM_NAMESPACES
              path: vmNamespaces
              default: [uds-labs-vms]
            - name: KUBEVIRT_OPERATOR_NODE_PLACEMENT
              path: operator.nodePlacement
              default: &defaultPlacement
                nodeSelector: {}
                affinity: {}
                tolerations: []
            - name: KUBEVIRT_INFRA_NODE_PLACEMENT
              path: kubevirt.infra.nodePlacement
              default: *defaultPlacement
            - name: KUBEVIRT_WORKLOAD_NODE_PLACEMENT
              path: kubevirt.workloads.nodePlacement
              default: *defaultPlacement

  - name: cdi
    repository: ghcr.io/uds-packages/cdi
    ref: 1.65.0-uds.5-upstream
    overrides:
      cdi:
        uds-cdi-config:
          variables:
            - name: OPERATOR_NODE_PLACEMENT
              path: operator.nodePlacement
              default: *defaultPlacement
            - name: INFRA_NODE_PLACEMENT
              path: cdi.infra
              default: *defaultPlacement
            - name: WORKLOAD_NODE_PLACEMENT
              path: cdi.workloads
              default: *defaultPlacement
            - name: EXPOSE_UPLOAD_PROXY
              path: uploadProxy.expose
              default: false
            - name: ALLOW_IMPORTER_EGRESS
              path: network.importerEgress.enabled
              default: true
            - name: WORKLOAD_NAMESPACES
              path: workloadNamespaces
              default: [uds-labs-vms]

  - name: uds-labs-vm-images
    path: ../packages/vm-images
    ref: "0.4.1"
    overrides:
      vm-image-server:
        vm-image-server:
          values:
            - path: imageServers.placement
              value: *defaultPlacement
      golden-pvcs:
        golden-pvcs:
          values:
            - path: goldenPVCs.storageClass
              value: ""

  - name: uds-labs
    path: ../
    ref: dev
    overrides:
      uds-labs:
        uds-labs:
          values:
            - path: serverPlacement
              value: *defaultPlacement
            - path: operatorPlacement
              value: *defaultPlacement
            - path: vmiPlacement
              value: *defaultPlacement
            - path: storageClass
              value: ""
            - path: maxActiveSessions
              value: 4
            - path: auth.allowedGroups
              value: []
