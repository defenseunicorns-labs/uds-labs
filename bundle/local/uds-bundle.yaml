# Local bare-k3s profile for the full UDS Labs E2E flow.
# UDS Core is deployed separately by the deploy-local-uds-core task.
kind: UDSBundle
metadata:
  name: uds-labs-local
  description: UDS Labs local KubeVirt development stack
  version: "0.4.1"

packages:
  - name: kubevirt
    path: ../kubevirt
    ref: dev-upstream
    overrides:
      kubevirt:
        uds-kubevirt-config:
          variables:
            - name: VM_NAMESPACES
              path: vmNamespaces
              default: [uds-labs-vms]
            - name: KUBEVIRT_OPERATOR_NODE_PLACEMENT
              path: operator.nodePlacement
              default: &localPlacement
                nodeSelector: {}
                affinity: {}
                tolerations: []
            - name: KUBEVIRT_INFRA_NODE_PLACEMENT
              path: kubevirt.infra.nodePlacement
              default: *localPlacement
            - name: KUBEVIRT_WORKLOAD_NODE_PLACEMENT
              path: kubevirt.workloads.nodePlacement
              default: *localPlacement

  - name: cdi
    path: ../cdi
    ref: dev-upstream
    overrides:
      cdi:
        uds-cdi-config:
          variables:
            - name: OPERATOR_NODE_PLACEMENT
              path: operator.nodePlacement
              default: *localPlacement
            - name: INFRA_NODE_PLACEMENT
              path: cdi.infra
              default: *localPlacement
            - name: WORKLOAD_NODE_PLACEMENT
              path: cdi.workloads
              default: *localPlacement
            - name: EXPOSE_UPLOAD_PROXY
              path: uploadProxy.expose
              default: false
            - name: ALLOW_IMPORTER_EGRESS
              path: network.importerEgress.enabled
              default: false

  - name: uds-labs-vm-images
    path: ../../packages/vm-images
    ref: "0.4.1"
    overrides:
      vm-image-server:
        vm-image-server:
          values:
            - path: imageServers.placement
              value: *localPlacement
      golden-pvcs:
        golden-pvcs:
          values:
            - path: goldenPVCs.storageClass
              value: local-path

  - name: uds-labs
    path: ../../
    ref: "0.4.1"
    overrides:
      uds-labs:
        uds-labs:
          values:
            - path: domain
              value: uds.dev
            - path: serverPlacement
              value: *localPlacement
            - path: operatorPlacement
              value: *localPlacement
            - path: vmiPlacement
              value: *localPlacement
            - path: storageClass
              value: local-path
            - path: maxActiveSessions
              value: 1
            # Local E2E still requires Keycloak authentication, but accepts any
            # authenticated user rather than requiring an environment group.
            - path: auth.allowedGroups
              value: []
