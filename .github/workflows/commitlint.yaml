name: PR Title Check

on:
  pull_request:
    branches: [master]
    types: [milestoned, opened, edited, reopened, synchronize]

jobs:
  validate:
    permissions:
      contents: read
      pull-requests: read
    uses: defenseunicorns/uds-common/.github/workflows/callable-commitlint.yaml@729f266d614a6e4f69876c2c69a789b78cc97853 # v1.28.0
