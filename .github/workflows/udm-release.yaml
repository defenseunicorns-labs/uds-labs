name: UDM Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install UDS CLI
        uses: defenseunicorns-udm/udm-common/.github/actions/uds-cli-setup@9aaad66b21c7637b5be3d6aafdb21c9e7ff1df2a # v0.10.3

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install golangci-lint
        run: |
          curl -sSfL -o /tmp/golangci-lint-install.sh https://raw.githubusercontent.com/golangci/golangci-lint/v2.11.4/install.sh
          echo "edfa587f31bde70db161d1e5b783e086a1627d7e2f7c91de5f7cca79bcdf8631  /tmp/golangci-lint-install.sh" | sha256sum -c -
          sh /tmp/golangci-lint-install.sh -b /usr/local/bin v2.11.4
          rm /tmp/golangci-lint-install.sh

      - name: Attest, vouch, and publish to registry.uds-mil.us
        run: |
          uds run udm-publish --no-progress \
            --with github_token="${{ secrets.GITHUB_TOKEN }}" \
            --with olm_cat="cat-api.uds-mil.us" \
            --with olm_org="defenseunicorns" \
            --with registry="registry.uds-mil.us" \
            --with registry_org="defenseunicorns" \
            --with registry_user_id="${{ secrets.REGISTRY_USER_ID }}" \
            --with registry_password="${{ secrets.REGISTRY_PASSWORD }}" \
            --with architecture="amd64"
