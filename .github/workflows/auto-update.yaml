name: Auto Update

on:
  schedule:
    - cron: 0 14 * * *

permissions:
  contents: write
  packages: read
  pull-requests: write
  id-token: write

concurrency:
  group: auto-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-update:
    uses: defenseunicorns/uds-common/.github/workflows/callable-auto-update.yaml@729f266d614a6e4f69876c2c69a789b78cc97853 # v1.28.0
    secrets: inherit
