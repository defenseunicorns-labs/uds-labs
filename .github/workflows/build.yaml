name: CI

# PR and branch CI validates source quality. Release publication is handled by
# release.yaml through the standard uds-common callable-publish workflow.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: defenseunicorns-udm/udm-common/.github/actions/uds-cli-setup@9aaad66b21c7637b5be3d6aafdb21c9e7ff1df2a # v0.10.3
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install golangci-lint
        run: |
          curl -sSfL -o /tmp/golangci-lint-install.sh https://raw.githubusercontent.com/golangci/golangci-lint/v2.11.4/install.sh
          echo "edfa587f31bde70db161d1e5b783e086a1627d7e2f7c91de5f7cca79bcdf8631  /tmp/golangci-lint-install.sh" | sha256sum -c -
          sh /tmp/golangci-lint-install.sh -b /usr/local/bin v2.11.4
          rm /tmp/golangci-lint-install.sh
      - name: Generate CAT Fulcio token
        run: |
          uds run olm:generate-fulcio-token \
            --with olm_cat="cat-api.uds-mil.us" \
            --with olm_org="defenseunicorns" \
            --with github_token="${{ secrets.GITHUB_TOKEN }}"
      - name: Lint
        run: uds run attest:lint
      - name: Security scan
        run: |
          uds run scan:security \
            --with gitleaks_scan_path="." \
            --with opengrep_scan_path="."
