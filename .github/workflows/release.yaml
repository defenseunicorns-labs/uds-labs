name: Release

on:
  push:
    branches:
      - master

# The reusable workflow owns release checks, package publication, and GitHub
# release/tag creation. Its source snapshot step is skipped for this non-uds-packages org.
permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  publish:
    permissions:
      contents: write
      packages: write
      id-token: write
    strategy:
      matrix:
        flavor: [upstream]
        architecture: [amd64]
    uses: defenseunicorns/uds-common/.github/workflows/callable-publish.yaml@729f266d614a6e4f69876c2c69a789b78cc97853 # v1.28.0
    with:
      flavor: ${{ matrix.flavor }}
      arch: ${{ matrix.architecture }}
      base-repo: ghcr.io/defenseunicorns-labs
      team: uds
      runsOn: ubuntu-latest
      timeout: 60
      publish-repo: true
      uds-pk: true
      options: >-
        --set BASE_REPO="ghcr.io/defenseunicorns-labs"
        --set TEAM="uds"
        --set OLM_CAT="cat-api.uds-mil.us"
        --set OLM_ORG="defenseunicorns"
    secrets: inherit
