name: UDS Proving Ground Compliance

# UDM Common provides the CAT/Witness compliance lane for applications being
# onboarded into UDS Proving Ground. Package publication remains owned by the
# separate release workflows.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: udm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance:
    name: UDS Proving Ground Compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: defenseunicorns-udm/udm-common/.github/actions/uds-cli-setup@9238b820485411b19d3511a749cd1482afba4302 # v0.13.4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install golangci-lint
        run: |
          curl -sSfL -o /tmp/golangci-lint-install.sh https://raw.githubusercontent.com/golangci/golangci-lint/v2.11.4/install.sh
          echo "edfa587f31bde70db161d1e5b783e086a1627d7e2f7c91de5f7cca79bcdf8631  /tmp/golangci-lint-install.sh" | sha256sum -c -
          sh /tmp/golangci-lint-install.sh -b /usr/local/bin v2.11.4
          rm /tmp/golangci-lint-install.sh
      - name: Generate CAT Fulcio token
        run: |
          uds run olm:generate-fulcio-token \
            --with olm_cat="cat-api.uds-mil.us" \
            --with olm_org="defenseunicorns" \
            --with github_token="${{ secrets.GITHUB_TOKEN }}"
      - name: Lint
        run: uds run attest:lint
      - name: Security scan
        run: |
          uds run scan:security \
            --with gitleaks_scan_path="." \
            --with opengrep_scan_path="."
