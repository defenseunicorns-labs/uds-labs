name: Scan

on:
  pull_request:
    branches: [master]
    paths:
      - zarf.yaml
      - releaser.yaml
      - chart/**
      - Dockerfile

jobs:
  scan:
    permissions:
      contents: read
      packages: read
      id-token: write
      pull-requests: write
    uses: defenseunicorns/uds-common/.github/workflows/callable-scan.yaml@729f266d614a6e4f69876c2c69a789b78cc97853 # v1.28.0
    secrets: inherit
