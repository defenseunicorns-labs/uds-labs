apiVersion: zarf.dev/v1alpha1
kind: ZarfPackageConfig
metadata:
  name: uds-labs
  description: Lab server and operator — CRD, Deployments, RBAC.  KubeVirt/CDI/UDS Core are in the bundle.
  version: v0.6.0-uds.2
components:
  - name: lab-crds
    description: LabSession CRD and VM namespace
    required: true
    manifests:
      - name: lab-crds
        files:
          - deploy/namespace.yaml
          - deploy/crd/labs.uds.dev_labsessions.yaml
    actions:
      onRemove:
        before:
          - cmd: |
              if ./zarf tools kubectl get crd labsessions.labs.uds.dev >/dev/null 2>&1; then
                ./zarf tools kubectl get labsessions.labs.uds.dev --all-namespaces \
                  -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' \
                  | while read -r namespace name; do
                      [ -n "$name" ] || continue
                      ./zarf tools kubectl -n "$namespace" patch labsession "$name" \
                        --type=merge -p '{"metadata":{"finalizers":[]}}'
                    done
              fi
            description: Remove orphaned LabSession teardown finalizers
  - name: uds-labs
    description: Lab server and operator Deployments, RBAC, and supporting resources
    required: true
    charts:
      - name: uds-labs
        version: v0.6.0-uds.2
        localPath: chart
        namespace: uds-labs
        variables:
          - name: DOMAIN
            description: Base domain for Istio expose
            path: domain
          - name: OPERATOR_ENABLED
            description: Enable the KubeVirt-backed LabSession operator
            path: operator.enabled
    images:
      - ghcr.io/defenseunicorns-labs/uds-labs:v0.6.0-uds.2
      - registry.k8s.io/pause:3.10
variables:
  - name: DOMAIN
    description: Base domain (e.g. uds.dev) — used by the UDS Package CR for Istio expose
    default: uds.dev
