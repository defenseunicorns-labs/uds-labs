{{- if .Values.imageServers.enabled }}
{{- $root := . }}
{{- range $name, $_ := .Values.images }}
apiVersion: v1
kind: Service
metadata:
  name: vm-image-{{ $name }}
  namespace: uds-labs-vms
  labels:
    app.kubernetes.io/name: vm-image-{{ $name }}
    app.kubernetes.io/part-of: uds-labs-vm-images
spec:
  selector:
    app.kubernetes.io/name: vm-image-{{ $name }}
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-image-{{ $name }}
  namespace: uds-labs-vms
  labels:
    app.kubernetes.io/name: vm-image-{{ $name }}
    app.kubernetes.io/part-of: uds-labs-vm-images
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: vm-image-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vm-image-{{ $name }}
        app.kubernetes.io/part-of: uds-labs-vm-images
    spec:
      automountServiceAccountToken: false
      nodeSelector:
{{ toYaml $root.Values.imageServers.placement.nodeSelector | nindent 8 }}
      affinity:
{{ toYaml $root.Values.imageServers.placement.affinity | nindent 8 }}
      tolerations:
{{ toYaml $root.Values.imageServers.placement.tolerations | nindent 8 }}
      containers:
        - name: image-server
          image: ghcr.io/defenseunicorns-labs/uds-labs-vm-images/{{ $name }}:{{ $root.Values.imageTag }}
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          startupProbe:
            httpGet: {path: /, port: http}
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
      securityContext:
        seccompProfile: {type: RuntimeDefault}
---
{{- end }}
{{- end }}
