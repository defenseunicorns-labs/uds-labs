# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
apiVersion: zarf.dev/v1alpha1
kind: ZarfPackageConfig
metadata:
  name: uds-labs-vm-images
  description: Lab playground VM images served to CDI from Zarf-managed Pods
  version: 0.4.1

components:
  - name: vm-image-server
    required: true
    description: Base and uds-core VM images exposed by cluster-local HTTP servers
    imageArchives:
      - path: base.tar
        images:
          - ghcr.io/defenseunicorns-labs/uds-labs-vm-images/base:0.4.1
      - path: uds-core.tar
        images:
          - ghcr.io/defenseunicorns-labs/uds-labs-vm-images/uds-core:0.4.1
    charts:
      - name: vm-image-server
        localPath: chart
        version: 0.4.1
        namespace: uds-labs-vms
        valuesFiles:
          - chart/values-image-servers.yaml
    actions:
      onDeploy:
        after:
          - description: Wait for UDS intra-namespace network policy
            maxTotalSeconds: 300
            wait:
              cluster:
                kind: package
                name: uds-labs-vm-images
                namespace: uds-labs-vms
                condition: ready
          - description: Wait for both VM image server Pods
            maxTotalSeconds: 1800
            wait:
              cluster:
                kind: pod
                name: app.kubernetes.io/part-of=uds-labs-vm-images
                namespace: uds-labs-vms
                condition: ready

  - name: golden-pvcs
    required: true
    description: Import golden VM disks from the cluster-local image servers
    charts:
      - name: golden-pvcs
        localPath: chart
        version: 0.4.1
        namespace: uds-labs-vms
        valuesFiles:
          - chart/values-golden-pvcs.yaml
    actions:
      onDeploy:
        after:
          - description: Wait for the base golden image import
            maxTotalSeconds: 3600
            wait:
              cluster:
                kind: datavolume
                name: golden-base
                namespace: uds-labs-vms
                condition: ready
          - description: Wait for the UDS Core golden image import
            maxTotalSeconds: 3600
            wait:
              cluster:
                kind: datavolume
                name: golden-uds-core
                namespace: uds-labs-vms
                condition: ready
          - description: Scale bootstrap image servers to zero
            cmd: ./zarf tools kubectl scale deployment/vm-image-base deployment/vm-image-uds-core --replicas=0 --namespace=uds-labs-vms
