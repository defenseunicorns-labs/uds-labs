tasks:
  - name: build-all
    description: Build uds-labs and VM image server containers (no qcow2 needed for VM images — uses existing base layer)
    actions:
      - description: Build uds-labs image
        cmd: |
          VERSION=$(grep '^  version:' zarf.yaml | head -1 | awk '{print $2}')
          echo "Building ghcr.io/defenseunicorns-labs/uds-labs:${VERSION}..."
          docker build -t "ghcr.io/defenseunicorns-labs/uds-labs:${VERSION}" .
        maxTotalSeconds: 600

  - name: push-all
    description: Push uds-labs and VM image server containers to ghcr.io
    actions:
      - description: Push uds-labs image
        cmd: |
          VERSION=$(grep '^  version:' zarf.yaml | head -1 | awk '{print $2}')
          echo "Pushing ghcr.io/defenseunicorns-labs/uds-labs:${VERSION}..."
          docker push "ghcr.io/defenseunicorns-labs/uds-labs:${VERSION}"
        maxTotalSeconds: 600

  - name: build-and-push
    description: Build then push all images to ghcr.io
    actions:
      - task: build-all
      - task: push-all
