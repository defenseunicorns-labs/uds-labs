---

tasks:
  - name: serve
    description: Build and open the cluster-free Scenario Preview for one scenario
    inputs:
      scenario:
        description: Scenario identifier
        default: python-to-uds
      port:
        description: Local HTTP port
        default: "8080"
    actions:
      - description: Build the native container image
        cmd: docker build -f cmd/scenario-preview/Dockerfile -t uds-labs/scenario-preview:dev .
      - description: Open Scenario Preview
        cmd: |
          docker run --rm --init \
            --cap-drop ALL \
            -p ${{ .inputs.port }}:8080 \
            uds-labs/scenario-preview:dev \
            --scenario ${{ .inputs.scenario }}
