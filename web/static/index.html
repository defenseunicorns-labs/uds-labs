<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UDS Labs</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav>
    <span class="logo">UDS Labs</span>
  </nav>

  <div id="resume-banner" class="resume-banner" hidden>
    <span>You have an active lab session.</span>
    <a id="resume-link" href="#">Resume Lab →</a>
    <button type="button" onclick="dismissResume()" aria-label="Dismiss active session message">×</button>
  </div>

  <main class="catalog">
    <header class="catalog-header">
      <h1>Interactive Labs</h1>
      <p>Hands-on UDS and Zarf exercises in a live environment. No local setup required.</p>
    </header>

    <div id="catalog-sections">
      <div class="loading-text">Loading labs…</div>
    </div>
  </main>

  <script>
    let activeSession = null;

    function fmtDuration(minutes) {
      if (!minutes) return '';
      if (minutes < 60) return `${minutes} min`;
      const hours = Math.floor(minutes / 60);
      const remainder = minutes % 60;
      return remainder ? `${hours}h ${remainder}m` : `${hours}h`;
    }

    function esc(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function loadCatalog() {
      const container = document.getElementById('catalog-sections');
      try {
        const response = await fetch('/api/catalog');
        if (!response.ok) throw new Error('Catalog request failed');
        const catalog = await response.json();
        container.innerHTML = '';

        catalog.sections.forEach(section => {
          const labs = section.items.filter(item => item.type === 'scenario');
          if (!labs.length) return;

          const sectionEl = document.createElement('section');
          sectionEl.className = 'catalog-section';
          sectionEl.innerHTML = `
            <div class="section-heading">
              <h2>${esc(section.title)}</h2>
              <p>${esc(section.description)}</p>
            </div>
            <div class="scenario-grid"></div>`;

          const grid = sectionEl.querySelector('.scenario-grid');
          labs.forEach(lab => grid.appendChild(buildCard(lab)));
          container.appendChild(sectionEl);
        });
      } catch {
        container.innerHTML = '<div class="loading-text">The catalog could not be loaded. Refresh to try again.</div>';
      }
    }

    function buildCard(lab) {
      const card = document.createElement('article');
      card.className = `scenario-card${lab.playground ? ' playground-card' : ''}`;
      card.innerHTML = `
        <div class="card-heading">
          <h3>${esc(lab.title)}</h3>
          ${lab.playground ? '<span class="tag tag-playground">Playground</span>' : ''}
        </div>
        <p>${esc(lab.description)}</p>
        <div class="scenario-meta">
          ${lab.duration ? `<span>${fmtDuration(lab.duration)}</span>` : ''}
          ${lab.difficulty ? `<span class="tag">${esc(lab.difficulty)}</span>` : ''}
        </div>
        <button class="card-action" type="button">${lab.playground ? 'Open playground' : 'Start scenario'} →</button>`;
      card.querySelector('.card-action').addEventListener('click', button => startLab(lab.id, button.currentTarget));
      return card;
    }

    async function checkActiveSession() {
      try {
        const response = await fetch('/api/sessions/me');
        if (!response.ok) return;
        activeSession = await response.json();
        document.getElementById('resume-link').href =
          `/lab.html?session=${activeSession.id}&scenario=${activeSession.scenario}`;
        document.getElementById('resume-banner').hidden = false;
      } catch {}
    }

    function dismissResume() {
      document.getElementById('resume-banner').hidden = true;
    }

    async function startLab(scenarioId, button) {
      const original = button.textContent;
      button.textContent = 'Starting…';
      button.disabled = true;

      try {
        const response = await fetch('/api/sessions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ scenario: scenarioId }),
        });
        if (response.status === 409 && activeSession) {
          window.location.href =
            `/lab.html?session=${activeSession.id}&scenario=${activeSession.scenario}`;
          return;
        }
        if (!response.ok) throw new Error(await response.text());
        const session = await response.json();
        window.location.href = `/lab.html?session=${session.id}&scenario=${scenarioId}`;
      } catch (error) {
        button.textContent = original;
        button.disabled = false;
        alert(`Failed to start lab: ${error.message}`);
      }
    }

    loadCatalog();
    checkActiveSession();
  </script>
</body>
</html>
