apiVersion: uds.dev/v1alpha1
kind: Exemption
metadata:
  name: uds-labs-cdi
  namespace: uds-policy-exemptions
spec:
  exemptions:
    - policies:
        - RestrictIstioTrafficOverrides
      matcher:
        kind: pod
        namespace: {{ .Values.vmNamespace }}
        name: ^(cdi-(upload|clone-source)-.*|[0-9a-f-]{36}-source-pod)$
      title: UDS Labs CDI clone traffic overrides
      description: >-
        CDI creates upload target Pods and UUID-named clone source Pods in the
        target PVC namespace with Istio traffic-interception overrides required
        for host-assisted PVC cloning.
