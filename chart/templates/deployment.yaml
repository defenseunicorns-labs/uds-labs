apiVersion: v1
kind: ServiceAccount
metadata:
  name: uds-labs
  namespace: {{ .Release.Namespace }}
---
# Server: read/write LabSessions in the VM namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uds-labs-server
  namespace: {{ .Values.vmNamespace }}
rules:
  - apiGroups: ["labs.uds.dev"]
    resources: ["labsessions"]
    verbs: ["create", "get", "list", "patch", "delete"]
  - apiGroups: ["labs.uds.dev"]
    resources: ["labsessions/status"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uds-labs-server
  namespace: {{ .Values.vmNamespace }}
subjects:
  - kind: ServiceAccount
    name: uds-labs
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: uds-labs-server
  apiGroup: rbac.authorization.k8s.io
{{- if eq (toString .Values.operator.enabled) "true" }}
---
# Operator: cluster-wide watch — LabSessions, Services, NetworkPolicies, Secrets.
# controller-runtime initializes cluster-scoped informers for all watched types.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-operator-watch
rules:
  - apiGroups: ["labs.uds.dev"]
    resources: ["labsessions", "labsessions/status", "labsessions/finalizers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # The capacity bootstrap waits for node labels and KubeVirt device resources
  # before it creates a VMI.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstances"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-operator-watch
subjects:
  - kind: ServiceAccount
    name: uds-labs
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: lab-operator-watch
  apiGroup: rbac.authorization.k8s.io
---
# Operator: write access to session resources in vmNamespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-operator
  namespace: {{ .Values.vmNamespace }}
rules:
  - apiGroups: ["labs.uds.dev"]
    resources: ["labsessions", "labsessions/status", "labsessions/finalizers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstances"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-operator
  namespace: {{ .Values.vmNamespace }}
subjects:
  - kind: ServiceAccount
    name: uds-labs
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: lab-operator
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uds-labs
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uds-labs
  template:
    metadata:
      labels:
        app: uds-labs
    spec:
      serviceAccountName: uds-labs
      nodeSelector:
{{ toYaml .Values.serverPlacement.nodeSelector | nindent 8 }}
      affinity:
{{ toYaml .Values.serverPlacement.affinity | nindent 8 }}
      tolerations:
{{ toYaml .Values.serverPlacement.tolerations | nindent 8 }}
      containers:
        - name: uds-labs
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: VM_NAMESPACE
              value: {{ .Values.vmNamespace | quote }}
            - name: SESSION_TTL_MINUTES
              value: {{ .Values.sessionTTLMinutes | default 60 | quote }}
            - name: MAX_ACTIVE_SESSIONS
              value: {{ .Values.maxActiveSessions | quote }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
---
{{- if eq (toString .Values.operator.enabled) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-operator
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-operator
  template:
    metadata:
      labels:
        app: lab-operator
    spec:
      serviceAccountName: uds-labs
      nodeSelector:
{{ toYaml .Values.operatorPlacement.nodeSelector | nindent 8 }}
      affinity:
{{ toYaml .Values.operatorPlacement.affinity | nindent 8 }}
      tolerations:
{{ toYaml .Values.operatorPlacement.tolerations | nindent 8 }}
      containers:
        - name: lab-operator
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/lab-operator"]
          env:
            - name: OPERATOR_CONFIG
              value: /etc/lab-operator/config.yaml
            - name: VM_NAMESPACE
              value: {{ .Values.vmNamespace | quote }}
          volumeMounts:
            - name: lab-operator-config
              mountPath: /etc/lab-operator
              readOnly: true
          resources:
            requests:
              cpu: 1000m
              memory: 128Mi
            limits:
              cpu: 4000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: lab-operator-config
          configMap:
            name: lab-operator-config
{{- end }}
