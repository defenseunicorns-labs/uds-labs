apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-ledger
  labels:
    app: release-ledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: release-ledger
  template:
    metadata:
      labels:
        app: release-ledger
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: release-ledger
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: EVIDENCE_DIR
              value: /var/lib/release-ledger/evidence
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "4"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
