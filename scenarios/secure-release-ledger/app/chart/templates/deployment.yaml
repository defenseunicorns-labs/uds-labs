apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-release-ledger
  labels:
    app: secure-release-ledger
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: secure-release-ledger
  template:
    metadata:
      labels:
        app: secure-release-ledger
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: release-ledger
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: EVIDENCE_DIR
              value: {{ .Values.evidenceDir | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: evidence
              mountPath: {{ .Values.evidenceDir | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
      volumes:
        - name: evidence
          emptyDir: {}
