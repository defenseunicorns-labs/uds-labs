title: "Package a Stateless App for UDS"
description: "Turn a pre-containerized Python application into a UDS package by adding its Helm chart, UDS Package CR, Zarf definition, bundle, and development tasks."
outcome: "Build and deploy a stateless application package to a live UDS Core cluster."
prerequisites:
  - "A containerized application"
  - "Basic Kubernetes and Helm familiarity"
duration: 60
difficulty: intermediate
orientation:
  mission: "Turn a pre-containerized Python application into a deployable UDS package."
  why: "Learn the repeatable boundary between application code, Kubernetes resources, Helm, UDS, Zarf, and bundle workflows."
  starting_point:
    provided:
      - "A working Python application and container image"
      - "A project workspace with the application source"
      - "A UDS Core lab environment"
    learner_changes:
      - "Helm Deployment and Service templates"
      - "UDS Package networking configuration"
      - "Zarf package, bundle, and development task definitions"
    not_required:
      - "Writing the application itself"
      - "Creating a Kubernetes cluster"
      - "Cloud credentials or external services"
  journey:
    - title: "Meet the application"
      description: "Inspect the Flask application, health endpoint, image, and port."
      purpose: "Understand the workload contract before writing deployment resources."
    - title: "Write the Helm chart"
      description: "Define the Deployment and Service that run the application."
      purpose: "Make the container runnable on Kubernetes."
    - title: "Add the UDS Package"
      description: "Declare network access and application exposure for UDS Core."
      purpose: "Connect the Kubernetes workload to the UDS platform."
    - title: "Create zarf.yaml"
      description: "Package the Helm chart and application image with Zarf."
      purpose: "Make the application portable for cluster deployment."
    - title: "Compose the bundle"
      description: "Add the package to a UDS bundle and create a development task."
      purpose: "Build a repeatable workflow for deploying the package."
    - title: "Deploy and verify"
      description: "Run the task and verify the application in the live cluster."
      purpose: "Confirm that the complete package works through the platform."
  success:
    criteria:
      - "Every guided checkpoint passes."
      - "The application deploys successfully to the live UDS Core cluster."
      - "The application health endpoint is reachable through the expected UDS path."
    final_state: "The Python application is running as a stateless UDS package deployed through a repeatable bundle task."
  tools:
    - "Terminal"
    - "Web IDE"
    - "Browser"
  important_notes:
    - "The VM is temporary and will be removed when you leave or when the lab expires."
    - "You will edit deployment and packaging files; the application source is already complete."
browser: true
image: uds-core
size: medium
tags:
  - uds
  - zarf
  - helm
  - python
  - docker
preview:
  fixture: preview/fixture
  workspace: /root/myapp
  checks:
    - step: 1
      path: app.py
      contains: ["@app.route(\"/health\")", "port=8080"]
    - step: 2
      path: chart/templates/deployment.yaml
      contains: ["kind: Deployment", "containerPort: 8080"]
    - step: 2
      path: chart/templates/service.yaml
      contains: ["kind: Service", "targetPort: 8080"]
    - step: 3
      path: chart/templates/uds-package.yaml
      contains: ["kind: Package", "enableAuthserviceSelector", "network:", "expose:"]
    - step: 4
      path: zarf.yaml
      contains: ["ZarfPackageConfig", "myapp:dev"]
    - step: 5
      path: bundle/uds-bundle.yaml
      contains: ["UDSBundle", "name: myapp"]
    - step: 5
      path: tasks.yaml
      contains: ["uds-common", "name: dev"]
steps:
  - title: "The app: Python Flask on port 8080"
    text: steps/1-meet-the-app.md
    verify: verify/step1.sh
  - title: "Write the Helm chart"
    text: steps/2-helm-chart.md
    verify: verify/step2.sh
  - title: "The UDS Package CR: network and mesh"
    text: steps/3-uds-package-cr.md
    verify: verify/step3.sh
  - title: "Write zarf.yaml"
    text: steps/4-zarf-yaml.md
    verify: verify/step4.sh
  - title: "Bundle and tasks"
    text: steps/5-bundle-tasks.md
    verify: verify/step5.sh
  - title: "Deploy and verify"
    text: steps/6-deploy.md
    verify: verify/step6.sh
