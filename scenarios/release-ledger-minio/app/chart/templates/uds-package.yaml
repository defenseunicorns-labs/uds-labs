apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  name: release-ledger-minio
  namespace: {{ .Release.Namespace }}
spec:
  network:
    serviceMesh:
      mode: ambient
    expose:
      - service: release-ledger-minio
        selector:
          app: release-ledger-minio
        gateway: tenant
        host: release-ledger-minio
        port: 8080
        uptime:
          checks:
            paths:
              - /health
    allow:
      - direction: Ingress
        remoteGenerated: IntraNamespace
      - direction: Egress
        remoteGenerated: IntraNamespace
      - direction: Egress
        selector:
          app: release-ledger-minio
        remoteNamespace: postgres
        remoteSelector:
          cluster-name: pg-cluster
        port: 5432
        description: PostgreSQL application access
      - direction: Egress
        selector:
          app: release-ledger-minio
        remoteNamespace: minio
        remoteSelector:
          v1.min.io/tenant: uds-minio
        port: 9000
        description: MinIO application access
