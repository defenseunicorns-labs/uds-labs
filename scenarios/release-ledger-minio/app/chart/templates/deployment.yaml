apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-ledger-minio
  labels:
    app: release-ledger-minio
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: release-ledger-minio
  template:
    metadata:
      labels:
        app: release-ledger-minio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: release-ledger
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: STORAGE_MODE
              valueFrom:
                configMapKeyRef:
                  name: release-ledger-config
                  key: STORAGE_MODE
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: release-ledger-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: release-ledger-config
                  key: DATABASE_PORT
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: release-ledger-config
                  key: DATABASE_NAME
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.databaseSecretName | quote }}
                  key: {{ .Values.storage.databaseUsernameKey | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.databaseSecretName | quote }}
                  key: {{ .Values.storage.databasePasswordKey | quote }}
            - name: EVIDENCE_STORAGE
              valueFrom:
                configMapKeyRef:
                  name: release-ledger-config
                  key: EVIDENCE_STORAGE
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: release-ledger-config
                  key: S3_ENDPOINT
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: release-ledger-config
                  key: S3_BUCKET
            - name: S3_USE_SSL
              valueFrom:
                configMapKeyRef:
                  name: release-ledger-config
                  key: S3_USE_SSL
            # TODO (learner): consume copied application credentials, never MinIO root credentials.
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.minioSecretName | quote }}
                  key: {{ .Values.storage.accessKeyKey | quote }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.minioSecretName | quote }}
                  key: {{ .Values.storage.secretKeyKey | quote }}
            - name: EVIDENCE_DIR
              value: {{ .Values.evidenceDir | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
