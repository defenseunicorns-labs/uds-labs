---

includes:
  # UDM Common owns the CAT/Witness onboarding namespaces below. Keep these
  # names because UDM tasks call one another by setup:*/olm:*/scan:* names.
  - attest: https://raw.githubusercontent.com/defenseunicorns-udm/udm-common/v0.13.4/tasks/attest.yaml
  - build: https://raw.githubusercontent.com/defenseunicorns-udm/udm-common/v0.13.4/tasks/build.yaml
  - olm: https://raw.githubusercontent.com/defenseunicorns-udm/udm-common/v0.13.4/tasks/olm.yaml
  # CAT/Witness tasks remain sourced from udm-common. Keep its publish
  # namespace explicit so the standard uds-common publish namespace remains
  # available for the reusable release workflow.
  - scan: https://raw.githubusercontent.com/defenseunicorns-udm/udm-common/v0.13.4/tasks/scan.yaml
  - setup: https://raw.githubusercontent.com/defenseunicorns-udm/udm-common/v0.13.4/tasks/setup.yaml
  - vouch: https://raw.githubusercontent.com/defenseunicorns-udm/udm-common/v0.13.4/tasks/vouch.yaml
  - udm-publish-tasks: https://raw.githubusercontent.com/defenseunicorns-udm/udm-common/v0.13.4/tasks/publish.yaml
  - uds-setup: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.28.0/tasks/setup.yaml
  - create: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.28.0/tasks/create.yaml
  - pull: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.28.0/tasks/pull.yaml
  - deploy: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.28.0/tasks/deploy.yaml
  - actions: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.28.0/tasks/actions.yaml
  - lint: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.28.0/tasks/lint.yaml
  - upgrade: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.28.0/tasks/upgrade.yaml
  - publish: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.28.0/tasks/publish.yaml
  - quality: tasks/quality.yaml
  - test: tasks/test.yaml
  - release-tasks: tasks/release.yaml
  - images: tasks/images.yaml
  - cluster: tasks/cluster.yaml
  - access: tasks/access.yaml
  - workflow: tasks/workflow.yaml
  - preview: tasks/preview.yaml

variables:
  # Set by the release workflow. Leaving these empty keeps local package
  # publishing from attempting an interactive CAT login.
  - name: OLM_CAT
    default: ""
  - name: OLM_ORG
    default: ""

# The implementations are grouped under tasks/. These adapters keep the
# original unqualified task names working while tasks.yaml remains the single
# entrypoint for `uds run`.

tasks:
  - name: clean-artifacts
    description: Remove all built Zarf packages, UDS bundles, and image tarballs
    inputs:
      skip:
        description: Set to 1 to skip artifact cleanup when WIPE_CLUSTER=0
        default: "0"
      clean:
        description: Clean artifacts (1 = clean)
        default: "1"
    actions:
      - task: quality:clean-artifacts
        with:
          skip: ${{ .inputs.skip }}
          clean: ${{ .inputs.clean }}

  - name: lint
    description: Run linters and static analysis
    actions:
      # The root compatibility task must remain directly executable because
      # attest:lint invokes `uds run lint`; maru-runner cannot resolve the
      # namespaced quality:lint task from this root task.
      - description: Run Go linters and static analysis
        cmd: golangci-lint run ./...

  - name: lint-all
    description: Run the grouped shell and YAML lint task
    actions:
      - task: quality:lint-all

  - name: preflight
    description: Verify required tools, KVM access, and image config
    actions:
      - task: quality:preflight

  - name: validate-package-config
    description: Validate deployment ordering without building images
    actions:
      - task: quality:validate-package-config

  - name: dry-run
    description: Render and validate Helm and Zarf packages without a cluster
    actions:
      - task: quality:dry-run

  - name: build-images
    description: Build VM qcow2 images with packer (base → uds-core)
    inputs:
      skip:
        description: Skip all packer builds (1 = skip)
        default: "0"
      skip_base:
        description: Skip base image build
        default: "0"
      skip_uds_core:
        description: Skip UDS Core image build
        default: "0"
      base_image:
        description: Existing base qcow2 to use when skip_base=1
        default: output/base/lab-base.qcow2
      build:
        description: Build packer images (1 = build)
        default: "1"
    actions:
      - task: images:build-images
        with:
          skip: ${{ .inputs.skip }}
          skip_base: ${{ .inputs.skip_base }}
          skip_uds_core: ${{ .inputs.skip_uds_core }}
          base_image: ${{ .inputs.base_image }}
          build: ${{ .inputs.build }}

  - name: build-vm-images
    description: Run images:build-vm-images
    inputs:
      build:
        description: Build local VM image-server containers (1 = build)
        default: "1"
      base_qcow2:
        description: Path to base qcow2 (combined base+tools image)
        default: packer/output/base/lab-base.qcow2
      uds_core_qcow2:
        description: Path to uds-core qcow2
        default: packer/output/uds-core/lab-playground-uds-core.qcow2
      tag:
        description: VM image tag (defaults to the VM image chart's imageTag)
        default: ""
    actions:
      - task: images:build-vm-images
        with:
          build: ${{ .inputs.build }}
          base_qcow2: ${{ .inputs.base_qcow2 }}
          uds_core_qcow2: ${{ .inputs.uds_core_qcow2 }}
          tag: ${{ .inputs.tag }}

  - name: push-vm-images
    description: Push VM image server container images to ghcr.io
    inputs:
      tag:
        description: VM image tag to push (defaults to the VM image chart's imageTag)
        default: ""
    actions:
      - task: images:push-vm-images
        with:
          tag: ${{ .inputs.tag }}

  - name: build-all
    description: Build uds-labs and VM image server containers (no qcow2 needed for VM images — uses existing base layer)
    actions:
      - task: images:build-all

  - name: build-image
    description: Build the uds-labs Docker image tagged for ghcr.io
    inputs:
      build_version:
        description: Version shown in the UI and embedded in the binaries
        default: ""
    actions:
      - task: images:build-image
        with:
          build_version: ${{ .inputs.build_version }}

  - name: push-all
    description: Push uds-labs and VM image server containers to ghcr.io
    actions:
      - task: images:push-all

  - name: push-image
    description: Push the uds-labs Docker image to ghcr.io
    actions:
      - task: images:push-image

  - name: build-lab-package
    description: Build the uds-labs Zarf package (lab server, operator, CRD, RBAC)
    actions:
      - task: images:build-lab-package

  - name: build-vm-images-package
    description: Build a local VM-image package or stage the published version consumed by the UDS bundle
    inputs:
      local:
        description: Build from local image archives (1) or pull the published package (0)
        default: "1"
      repository:
        description: OCI repository containing published VM-image packages
        default: ghcr.io/defenseunicorns-labs/uds-labs-vm-images
    actions:
      - task: images:build-vm-images-package
        with:
          local: ${{ .inputs.local }}
          repository: ${{ .inputs.repository }}

  - name: build-bundle
    description: Build the selected UDS bundle profile
    inputs:
      profile:
        description: Bundle profile to build (default or local)
        default: default
    actions:
      - task: images:build-bundle
        with:
          profile: ${{ .inputs.profile }}

  - name: deploy-bundle
    description: Deploy the latest bundle for the selected profile
    inputs:
      profile:
        description: Bundle profile to deploy (default or local)
        default: default
      config:
        description: Path to the ignored, environment-specific default-profile config
        default: bundle/uds-config.yaml
    actions:
      - task: images:deploy-bundle
        with:
          profile: ${{ .inputs.profile }}
          config: ${{ .inputs.config }}

  - name: build-and-push
    description: Build then push all images to ghcr.io
    actions:
      - task: images:build-and-push

  - name: wipe-k3s
    description: Uninstall k3s if present
    inputs:
      skip:
        description: Set to 1 to skip this step
        default: "0"
      run:
        description: Run this step (1 = run)
        default: "1"
    actions:
      - task: cluster:wipe-k3s
        with:
          skip: ${{ .inputs.skip }}
          run: ${{ .inputs.run }}

  - name: install-k3s
    description: Install k3s with traefik and servicelb disabled
    inputs:
      skip:
        description: Set to 1 to skip this step
        default: "0"
      run:
        description: Run this step (1 = run)
        default: "1"
    actions:
      - task: cluster:install-k3s
        with:
          skip: ${{ .inputs.skip }}
          run: ${{ .inputs.run }}

  - name: install-metallb
    description: Install MetalLB and configure IP pool (auto-detects host subnet)
    inputs:
      skip:
        description: Set to 1 to skip this step
        default: "0"
      run:
        description: Run this step (1 = run)
        default: "1"
      version:
        description: MetalLB version
        default: v0.14.9
      range:
        description: "Override MetalLB IP range (auto-detected from host IP if empty)"
        default: ""
    actions:
      - task: cluster:install-metallb
        with:
          skip: ${{ .inputs.skip }}
          run: ${{ .inputs.run }}
          version: ${{ .inputs.version }}
          range: ${{ .inputs.range }}

  - name: zarf-init
    description: Initialize Zarf in the cluster
    inputs:
      skip:
        description: Set to 1 to skip this step
        default: "0"
      run:
        description: Run this step (1 = run)
        default: "1"
    actions:
      - task: cluster:zarf-init
        with:
          skip: ${{ .inputs.skip }}
          run: ${{ .inputs.run }}

  - name: wait-kubevirt
    description: Wait for KubeVirt to reach Available status
    actions:
      - task: cluster:wait-kubevirt

  - name: populate-golden-pvcs
    description: Import pre-built qcow2 images into golden PVCs (auto-skips if qcow2s not found)
    inputs:
      skip:
        description: Set to 1 to force-skip import regardless of file presence
        default: "0"
      base_qcow2:
        description: Path to base qcow2
        default: packer/output/base/lab-base.qcow2
      uds_core_qcow2:
        description: Path to UDS Core qcow2
        default: packer/output/uds-core/lab-playground-uds-core.qcow2
      namespace:
        description: Namespace for golden PVCs
        default: uds-labs-vms
      host_ip:
        description: Host IP reachable from cluster pods (auto-detected when empty)
        default: ""
      port_base:
        description: Temporary HTTP port for the base image
        default: "18888"
      port_uds_core:
        description: Temporary HTTP port for the UDS Core image
        default: "18890"
    actions:
      - task: cluster:populate-golden-pvcs
        with:
          skip: ${{ .inputs.skip }}
          base_qcow2: ${{ .inputs.base_qcow2 }}
          uds_core_qcow2: ${{ .inputs.uds_core_qcow2 }}
          namespace: ${{ .inputs.namespace }}
          host_ip: ${{ .inputs.host_ip }}
          port_base: ${{ .inputs.port_base }}
          port_uds_core: ${{ .inputs.port_uds_core }}

  - name: deploy-local-uds-core
    description: Deploy pinned standalone UDS Core packages onto the existing bare-k3s cluster
    inputs:
      run:
        description: Deploy UDS Core (1) or preserve the existing installation (0)
        default: "1"
      base_package:
        description: Pinned standalone UDS Core base package
        default: oci://ghcr.io/defenseunicorns/packages/uds/core-base:1.10.0-upstream
      identity_package:
        description: Pinned standalone UDS Core identity and authorization package
        default: oci://ghcr.io/defenseunicorns/packages/uds/core-identity-authorization:1.10.0-upstream
    actions:
      - task: cluster:deploy-local-uds-core
        with:
          run: ${{ .inputs.run }}
          base_package: ${{ .inputs.base_package }}
          identity_package: ${{ .inputs.identity_package }}

  - name: bootstrap-local-cluster
    description: Local-only bootstrap for k3s, MetalLB, and Zarf init. Bundle deploy remains the canonical test path.
    inputs:
      WIPE_CLUSTER:
        description: Wipe and reinstall k3s (1 = wipe/bootstrap, 0 = skip bootstrap)
        default: "1"
    actions:
      - task: cluster:bootstrap-local-cluster
        with:
          WIPE_CLUSTER: ${{ .inputs.WIPE_CLUSTER }}

  - name: verify-cluster
    description: Print cluster node and workload status summary
    actions:
      - task: cluster:verify-cluster

  - name: patch-coredns
    description: Patch CoreDNS to route *.uds.dev to MetalLB gateways
    actions:
      - task: access:patch-coredns

  - name: create-test-session
    description: Create a LabSession for exercising the operator without the browser
    inputs:
      namespace:
        description: Namespace for the LabSession
        default: uds-labs-vms
      scenario_id:
        description: Scenario identifier to launch
        default: playground-tools
      client_id:
        description: Client identifier associated with the session
        default: testuser
      ttl_minutes:
        description: Session lifetime in minutes
        default: "60"
      name:
        description: LabSession name (generated when empty)
        default: ""
    actions:
      - task: access:create-test-session
        with:
          namespace: ${{ .inputs.namespace }}
          scenario_id: ${{ .inputs.scenario_id }}
          client_id: ${{ .inputs.client_id }}
          ttl_minutes: ${{ .inputs.ttl_minutes }}
          name: ${{ .inputs.name }}

  - name: test-session-lifecycle
    description: Create, verify, and delete a KubeVirt-backed LabSession
    actions:
      - task: access:test-session-lifecycle

  - name: create-test-user
    description: Create the documented local Keycloak test user in /UDS Core/Admin
    actions:
      - task: access:create-test-user

  - name: start-proxy
    description: Start nginx SNI reverse proxy (auto-detects MetalLB IPs)
    actions:
      - task: access:start-proxy

  - name: stop-proxy
    description: Stop nginx SNI reverse proxy
    actions:
      - task: access:stop-proxy

  - name: deploy-stack
    description: Build and deploy the UDS bundle, then run read-only cluster verification.
    inputs:
      BUILD_IMAGES:
        description: Build local packer images (1 = build)
        default: "0"
      SKIP_BASE:
        description: Skip base image build
        default: "0"
      SKIP_UDS_CORE:
        description: Skip UDS Core image build
        default: "0"
      VM_IMAGE_TAG:
        description: VM image tag (defaults to package version)
        default: ""
      LOCAL_VM_IMAGES:
        description: Build and embed local VM image-server containers instead of pulling published images
        default: "0"
      BUNDLE_CONFIG:
        description: Path to the deploy-time bundle configuration
        default: bundle/uds-config.yaml
    actions:
      - task: workflow:deploy-stack
        with:
          BUILD_IMAGES: ${{ .inputs.BUILD_IMAGES }}
          SKIP_BASE: ${{ .inputs.SKIP_BASE }}
          SKIP_UDS_CORE: ${{ .inputs.SKIP_UDS_CORE }}
          VM_IMAGE_TAG: ${{ .inputs.VM_IMAGE_TAG }}
          LOCAL_VM_IMAGES: ${{ .inputs.LOCAL_VM_IMAGES }}
          BUNDLE_CONFIG: ${{ .inputs.BUNDLE_CONFIG }}

  - name: cluster-up
    description: "Backward-compatible alias: bootstrap local k3s, then deploy the UDS bundle."
    inputs:
      WIPE_CLUSTER:
        description: Wipe and reinstall k3s (1 = wipe/bootstrap)
        default: "1"
      BUILD_IMAGES:
        description: Build local packer images (1 = build)
        default: "0"
      SKIP_BASE:
        description: Skip base image build
        default: "0"
      SKIP_UDS_CORE:
        description: Skip UDS Core image build
        default: "0"
      VM_IMAGE_TAG:
        description: VM image tag (defaults to package version)
        default: ""
      LOCAL_VM_IMAGES:
        description: Build and embed local VM image-server containers instead of pulling published images
        default: "0"
      BUNDLE_CONFIG:
        description: Path to the deploy-time bundle configuration
        default: bundle/uds-config-local.yaml
    actions:
      - task: workflow:cluster-up
        with:
          WIPE_CLUSTER: ${{ .inputs.WIPE_CLUSTER }}
          BUILD_IMAGES: ${{ .inputs.BUILD_IMAGES }}
          SKIP_BASE: ${{ .inputs.SKIP_BASE }}
          SKIP_UDS_CORE: ${{ .inputs.SKIP_UDS_CORE }}
          VM_IMAGE_TAG: ${{ .inputs.VM_IMAGE_TAG }}
          LOCAL_VM_IMAGES: ${{ .inputs.LOCAL_VM_IMAGES }}
          BUNDLE_CONFIG: ${{ .inputs.BUNDLE_CONFIG }}

  - name: redeploy
    description: Rebuild and redeploy through the canonical UDS bundle
    inputs:
      vm_image_tag:
        description: VM image tag (defaults to package version)
        default: ""
      BUNDLE_CONFIG:
        description: Path to the deploy-time bundle configuration
        default: bundle/uds-config-local.yaml
    actions:
      - task: workflow:redeploy
        with:
          vm_image_tag: ${{ .inputs.vm_image_tag }}
          BUNDLE_CONFIG: ${{ .inputs.BUNDLE_CONFIG }}

  - name: smoke-test
    description: Verify golden PVCs, platform, and authservice
    actions:
      - task: workflow:smoke-test

  # Standard UDS package task contract. Implementations live under test: so
  # package-level k3d workflows remain separate from the full local E2E flow.
  - name: default
    description: Setup a k3d cluster, deploy the package, and run package checks
    actions:
      - task: test:default

  - name: create-dev-package
    description: Build the current application image and create the test package
    actions:
      - task: test:create-dev-package

  - name: create-deploy-test-bundle
    description: Deploy the package and run package-level health checks
    actions:
      - task: test:create-deploy-test-package

  - name: dev
    description: Create and deploy the package on an existing k3d cluster
    actions:
      - task: test:dev

  # Called by uds-common's callable-test workflow. Keep these adapters at the
  # root because callable-test invokes the unqualified task names.
  - name: test-install
    description: Test installing the current package on a fresh k3d cluster
    actions:
      - task: test:test-install

  - name: test-upgrade
    description: Test upgrading the latest published package to the current branch
    actions:
      - task: test:test-upgrade

  - name: validate-package-artifact
    description: Deploy the freshly built package on k3d and run package-only checks
    actions:
      - task: cluster:k3d-test-cluster-with-retry
      - task: deploy:package
        with:
          options: "--set OPERATOR_ENABLED=false"
      - description: Verify the package-only deployment
        shell:
          linux: bash
          darwin: bash
        cmd: |
          set -euo pipefail
          kubectl wait deployment/uds-labs -n uds-labs --for=condition=Available --timeout=300s
          kubectl wait packages/uds-labs -n uds-labs --for=jsonpath='{.status.phase}'=Ready --timeout=300s

  # Called by uds-common's callable-publish workflow. This keeps the standard
  # release contract while preserving the lab-specific image/package build.
  - name: publish-package
    description: Build, vouch to CAT, and publish the UDS Labs Zarf package
    inputs:
      flavor:
        description: Package flavor to build and publish
        default: upstream
    actions:
      - task: release-tasks:prepare
        with:
          flavor: ${{ .inputs.flavor }}

      - description: Read the release version used in the Zarf archive filename
        cmd: uds zarf tools yq -r '.metadata.version' zarf.yaml
        setVariables:
          - name: PACKAGE_VERSION

      - task: actions:determine-arch

      - description: Generate the CAT Fulcio token for a signed package build
        if: ${{ and (ne .variables.OLM_CAT "") (ne .variables.OLM_ORG "") }}
        task: olm:generate-fulcio-token
        with:
          olm_cat: ${{ .variables.OLM_CAT }}
          olm_org: ${{ .variables.OLM_ORG }}
          github_token: ${{ .variables.GH_TOKEN }}

      - description: Build the application image using the zarf.yaml image reference
        task: images:build-image
        with:
          build_version: ${{ .variables.PACKAGE_VERSION }}

      - description: Create a signed Zarf package for CAT
        if: ${{ and (ne .variables.OLM_CAT "") (ne .variables.OLM_ORG "") }}
        task: build:zarf-package
        with:
          zarf_path: .
          architecture: ${{ .variables.ARCH }}
          zarf_flavor: ${{ .inputs.flavor }}
          witness_workingdir: .

      - description: Create an unsigned package for local runs without CAT
        if: ${{ or (eq .variables.OLM_CAT "") (eq .variables.OLM_ORG "") }}
        task: build:zarf-package
        with:
          zarf_path: .
          architecture: ${{ .variables.ARCH }}
          zarf_flavor: ${{ .inputs.flavor }}
          enable_sigstore: "false"
          witness_workingdir: .

      - description: Validate the built package on k3d before publication
        task: validate-package-artifact

      - description: Vouch the package and its build attestation to CAT
        if: ${{ and (ne .variables.OLM_CAT "") (ne .variables.OLM_ORG "") }}
        task: vouch:package
        with:
          olm_cat: ${{ .variables.OLM_CAT }}
          olm_org: ${{ .variables.OLM_ORG }}
          attestations: zarf-create-witness.json
          test_directory: ""

      # The uds-common dispatcher defaults the archive version to ${VERSION},
      # which is unset after Package Kit renders zarf.yaml. Select the concrete
      # publisher here so both direct and workflow releases use the archive we built.
      - description: Publish a release-please package to GHCR
        if: ${{ eq .variables.ENABLE_UDS_PK "false" }}
        task: publish:release-please-publish
        with:
          path: .
          version: ${{ .variables.PACKAGE_VERSION }}
          architecture: ${{ .variables.ARCH }}
          team: uds
          name: uds-labs
          flavor: ${{ .inputs.flavor }}

      - description: Publish a Package Kit release to GHCR
        if: ${{ eq .variables.ENABLE_UDS_PK "true" }}
        task: publish:uds-pk-publish
        with:
          path: .
          architecture: ${{ .variables.ARCH }}
          team: uds
          name: uds-labs
          flavor: ${{ .inputs.flavor }}

  # Primary release pipeline: UDM Common provides compliance and promotion,
  # while the validated Zarf archive is published to GHCR before UDS Proving Ground.
  - name: release
    description: Build, attest, vouch, and promote the package through the release registries
    inputs:
      github_token:
        description: GitHub token used to install OLM from GHCR
        default: ""
      olm_cat:
        description: CAT host used for Fulcio and vouch
        default: cat-api.uds-mil.us
      olm_org:
        description: CAT/OLM organization
        default: defenseunicorns
      registry:
        description: UDS Proving Ground OCI registry
        default: registry.uds-mil.us
      registry_org:
        description: Organization path in the UDS Proving Ground registry
        default: defenseunicorns
      registry_user_id:
        description: Registry username
        default: ""
      registry_password:
        description: Registry password
        default: ""
      architecture:
        description: Package architecture
        default: amd64
    actions:
      - task: release-tasks:prepare
        with:
          flavor: upstream

      - description: Read the release version for the build metadata
        cmd: uds zarf tools yq -r '.metadata.version' zarf.yaml
        setVariables:
          - name: PACKAGE_VERSION

      - description: Generate Fulcio token for attested tasks
        task: olm:generate-fulcio-token
        with:
          olm_cat: ${{ .inputs.olm_cat }}
          olm_org: ${{ .inputs.olm_org }}
          github_token: ${{ .inputs.github_token }}

      - description: Attest repository lint
        task: attest:lint

      - description: Run security scans
        task: scan:security
        with:
          gitleaks_scan_path: .
          opengrep_scan_path: .

      - description: Build the application image used by the Zarf package
        task: images:build-image
        with:
          build_version: ${{ .variables.PACKAGE_VERSION }}

      - description: Refresh Fulcio token before the package build
        task: olm:generate-fulcio-token
        with:
          olm_cat: ${{ .inputs.olm_cat }}
          olm_org: ${{ .inputs.olm_org }}
          github_token: ${{ .inputs.github_token }}

      - description: Build the signed Zarf package
        task: build:zarf-package
        with:
          zarf_path: .
          architecture: ${{ .inputs.architecture }}
          zarf_flavor: upstream
          witness_workingdir: .

      - description: Record the exact Zarf archive produced for this release
        shell:
          linux: bash
          darwin: bash
        cmd: |
          set -euo pipefail
          VERSION="$(uds-pk release show upstream)"
          # `release show` includes the flavor suffix (for example, -upstream).
          ARCHIVE="./zarf-package-uds-labs-${{ .inputs.architecture }}-${VERSION}.tar.zst"
          [ -f "$ARCHIVE" ] || { echo "ERROR: expected release archive $ARCHIVE" >&2; exit 1; }
          printf '%s\n' "$ARCHIVE"
        setVariables:
          - name: PACKAGE_ARCHIVE

      - description: Validate the built package on k3d before publication
        task: validate-package-artifact

      - description: Publish the validated release archive to GHCR and create the GitHub release
        task: publish:uds-pk-publish
        with:
          path: .
          architecture: ${{ .inputs.architecture }}
          team: uds
          name: uds-labs
          flavor: upstream

      - description: Vouch the package and attestations to CAT
        task: vouch:package
        with:
          olm_cat: ${{ .inputs.olm_cat }}
          olm_org: ${{ .inputs.olm_org }}
          attestations: lint-witness.json,gitleaks-witness.json,opengrep-witness.json,zarf-create-witness.json
          sarif_files: gitleaks.sarif.json,opengrep.sarif.json
          test_directory: ""

      - description: Publish the vouched release archive to the UDS Proving Ground registry
        task: udm-publish-tasks:zarf-package
        with:
          registry: ${{ .inputs.registry }}
          registry_org: ${{ .inputs.registry_org }}
          zarf_package: ${{ .variables.PACKAGE_ARCHIVE }}
          registry_user_id: ${{ .inputs.registry_user_id }}
          registry_password: ${{ .inputs.registry_password }}

  - name: local-e2e
    description: "Full local E2E on bare k3s, including UDS Core and browser access"
    inputs:
      WIPE_CLUSTER:
        description: Wipe and reinstall k3s (1 = wipe)
        default: "1"
      UDS_CORE_BASE_PACKAGE:
        description: Pinned standalone UDS Core base package
        default: oci://ghcr.io/defenseunicorns/packages/uds/core-base:1.10.0-upstream
      UDS_CORE_IDENTITY_PACKAGE:
        description: Pinned standalone UDS Core identity and authorization package
        default: oci://ghcr.io/defenseunicorns/packages/uds/core-identity-authorization:1.10.0-upstream
      BUILD_IMAGES:
        description: Build local Packer images (1 = build)
        default: "0"
      SKIP_BASE:
        description: Skip the base Packer image build
        default: "0"
      SKIP_UDS_CORE:
        description: Skip the UDS Core Packer image build
        default: "0"
      VM_IMAGE_TAG:
        description: VM image tag (defaults to package version)
        default: ""
      LOCAL_VM_IMAGES:
        description: Build the VM-image package from local qcow2 files (1) or reuse/pull it (0)
        default: "0"
      BUNDLE_CONFIG:
        description: Path to the deploy-time bundle configuration
        default: bundle/uds-config-local.yaml
    actions:
      - task: workflow:local-e2e
        with:
          WIPE_CLUSTER: ${{ .inputs.WIPE_CLUSTER }}
          UDS_CORE_BASE_PACKAGE: ${{ .inputs.UDS_CORE_BASE_PACKAGE }}
          UDS_CORE_IDENTITY_PACKAGE: ${{ .inputs.UDS_CORE_IDENTITY_PACKAGE }}
          BUILD_IMAGES: ${{ .inputs.BUILD_IMAGES }}
          SKIP_BASE: ${{ .inputs.SKIP_BASE }}
          SKIP_UDS_CORE: ${{ .inputs.SKIP_UDS_CORE }}
          VM_IMAGE_TAG: ${{ .inputs.VM_IMAGE_TAG }}
          LOCAL_VM_IMAGES: ${{ .inputs.LOCAL_VM_IMAGES }}
          BUNDLE_CONFIG: ${{ .inputs.BUNDLE_CONFIG }}
